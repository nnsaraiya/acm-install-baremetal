apiVersion: v1alpha1
kind: AgentConfig
metadata:
  name: hub
rendezvousIP: 192.168.130.10
hosts:
  - hostname: hub
    role: master
    # Pin the install to the OS disk (vda) so the second disk (vdb) stays
    # untouched for LVM Storage to consume later.
    rootDeviceHints:
      deviceName: /dev/vda
    interfaces:
      - name: enp1s0
        macAddress: "52:54:00:aa:bb:01"
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          mac-address: "52:54:00:aa:bb:01"
          ipv4:
            enabled: true
            dhcp: false
            address:
              - ip: 192.168.130.10
                prefix-length: 24
      dns-resolver:
        config:
          server:
            - 192.168.130.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.130.1
            next-hop-interface: enp1s0

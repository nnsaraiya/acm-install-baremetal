apiVersion: v1
baseDomain: baremetal.local
metadata:
  name: hub
compute:
- name: worker
  replicas: 0
controlPlane:
  name: master
  replicas: 1
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 192.168.130.0/24
platform:
  none: {}
# Generate with: jq -c . ~/.openshift/pull-secret.json
pullSecret: 'REPLACE_PULL_SECRET_JSON'
# Generate with: cat ~/.ssh/id_rsa.pub
sshKey: 'REPLACE_SSH_PUBLIC_KEY'
